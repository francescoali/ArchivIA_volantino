<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizzazione PDF</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #525659; /* Sfondo tipico dei lettori PDF */
        }
        embed, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Sostituisci "nome-file.pdf" con il nome o il percorso del tuo file PDF -->
    <embed src="Testo del paragrafo.pdf" type="application/pdf" />

</body>
</html>
